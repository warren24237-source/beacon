# Runs on every push to GitHub: typecheck, lint and the automatic tests.
# A red cross on the commit means something broke; nothing ships until it's green.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
